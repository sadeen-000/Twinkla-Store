<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>شكراً لطلبك - Twinkla</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou {
      max-width: 500px;
      margin: 100px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .thankyou h2 {
      color: #a566c2;
      margin-bottom: 15px;
    }

    .thankyou p {
      font-size: 16px;
      margin-bottom: 25px;
    }

    .thankyou a {
      background-color: #a566c2;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
    }

    .thankyou a:hover {
      background-color: #843ea2;
    }
  </style>
</head>
<body>

  <div class="thankyou">
    <h2>تم استلام طلبك بنجاح!</h2>
    <p>شكرًا لثقتك بنا  سنقوم بالتواصل معك قريبًا لتأكيد التفاصيل  </p>
    <a href="index.html">العودة إلى الصفحة الرئيسية</a>
  </div>

</body>
</html>
